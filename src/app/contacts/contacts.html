<section class="contact-me_section container mt-5">
    <div class="row">
        <div class="col-md-12 text-color_white">
            <section class="title_container ">
                <div class="row">
                    <div class="col-md-12 position-relative">
                        <h2 class="position-relative m-0 title">
                            <span class="d-inline-block mark_color">#</span>
                            <span class="d-inline-block text-color_white">Contacts</span>
                        </h2>
                    </div>
                </div>
            </section>
        </div> 
        <div class="col-md-12 text-color_white">
            <section class="content_container">
                <div class="row">
                    <div class="col-md-5 col-sm-12 about_box">
                        <span class="slug mb-5 d-block">Who am i?</span>
                        <p class="mb-5">
                            {{aboutMe}}
                        </p>
                    </div>
                    <div class="col-md-7 col-sm-12 data_box">
                        <div class="item">
                            <div class="item_title p-3">
                                <p class="m-0 p-0 text-color_white">Call me here</p>
                            </div>
                            <div class="item_content p-3">
                                <span class="d-inline">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                </span>
                                <a href="tel:01114805629" class="d-inline px-3 text-color_white">01114805629</a>
                            </div>
                        </div>
                        <div class="item">
                            <div class="item_title p-3">
                                <p class="m-0 p-0 text-color_white">Message me here</p>
                            </div>
                            <div class="item_content p-3">
                                <span class="d-inline">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path></svg>
                                </span>
                                <a href="mailto:kareem.mahmoud.abd.elhannan@gmail.com" target="_blank" aria-label="gmail" class="d-inline px-3 text-color_white">kareem.mahmoud.abd.elhannan@gmail.com</a>
                            </div>
                            <div class="item_content p-3">
                                <span class="d-inline">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="none" fill-rule="evenodd"><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8c0-1.1.9-2 2-2h5M15 3h6v6M10 14L20.2 3.8"/></g></svg>
                                </span>
                                <a href="https://www.linkedin.com/in/kareem-elbeltagy/" target="_blank" aria-label="linkedin" class="d-inline px-3 text-color_white">LinkedIn/kareem-elbeltagy</a>
                            </div>
                        </div>
                    </div>    
                </div>
            </section>    
        </div>
        <div class="col-md-12 text-color_white">
            <section class="title_container">
                <div class="row">
                    <div class="col-md-12 position-relative mb-5">
                        <h2 class="position-relative m-0 title">
                            <span class="d-inline-block mark_color">#</span>
                            <span class="d-inline-block text-color_white">Media</span>
                        </h2>
                    </div>
                    <div class="col-lg-5 col-md-5 col-sm-12 position-relative social mb-5">
                        <div class="box">
                            <span class="d-inline">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="none" fill-rule="evenodd"><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8c0-1.1.9-2 2-2h5M15 3h6v6M10 14L20.2 3.8"/></g></svg>
                            </span>
                            <a href="https://www.linkedin.com/in/kareem-elbeltagy/" aria-label="linkedin" target="_blank" class="d-inline px-3 text-color_white">LinkedIn/kareem-elbeltagy</a>
                        </div>
                        <div class="box">
                            <span class="d-inline">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ABB2BF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><g fill="none" fill-rule="evenodd"><path d="M18 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8c0-1.1.9-2 2-2h5M15 3h6v6M10 14L20.2 3.8"/></g></svg>
                            </span>
                            <a href="https://github.com/kareem-mahmoud" aria-label="github" target="_blank" class="d-inline px-3 text-color_white">Github/kareem-mahmoud</a>
                        </div>
                    </div>
                    <div class="col-lg-7 col-md-7 col-sm-12 position-relative social mb-5">
                        <div class="form_box">
                            <form  (onSubmit)="onSubmit()">
                                <div class="form-group">
                                    <input type="text" placeholder="Your Name" [field]="contactModel.name" rquired>
                                </div>
                                <div class="form-group">
                                    <input type="text" placeholder="Phone Number" [field]="contactModel.phone" rquired>
                                </div>
                                <div class="form-group">
                                    <input type="Email" placeholder="E-mail" [field]="contactModel.email" rquired>
                                </div>
                                <div class="form-group">
                                    <textarea placeholder="Your Inquire" rows="9" ></textarea>
                                </div>
                                <div class="form-group">
                                    <button type="submit">Send Message</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </section>
        </div> 
    </div>
</section>
