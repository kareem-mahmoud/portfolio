
    <div class="item mb-5">
        <div class="img_box">
            <img [src]="projectImageUrl()" alt="{{projectImageAlt()}}">
        </div>
        <div class="item_content">
            <div class="skills p-3 d-flex flex-wrap">
                @for(skill of projectSkills(); track $index) {
                    <span class="d-flex align-items-center justify-content-center text-color_gray">
                        @if(skill === 'HTML5'){
                            <svg width="18px" height="18px" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M6 28L4 3H28L26 28L16 31L6 28Z" fill="#E44D26"/>
                                <path d="M26 5H16V29.5L24 27L26 5Z" fill="#F16529"/>
                                <path d="M9.5 17.5L8.5 8H24L23.5 11H11.5L12 14.5H23L22 24L16 26L10 24L9.5 19H12.5L13 21.5L16 22.5L19 21.5L19.5 17.5H9.5Z" fill="white"/>
                            </svg>
                        }
                        <span class="d-inline-block ms-1 text-color_gray">{{skill}},</span>
                    </span>
                }
            </div>
            <h4 class="text-color_white p-3 m-0">{{projectName()}}</h4>
            <p class="text-color_gray p-3 m-0 pt-0">{{projectDescription()}}</p>
            <div class="item_controls p-3">
            @if(projectLiveFlag() === true) {
                <a [href]="projectLiveUrl()" class="text-color_white fs-6 d-inline-block live_btn"
                aria-label="link to live project"
                target="_blank"
                >Live <~></a>
            }
            </div>

            @if(projectCategory() === 'Website') {
                <p>{{projectCategory()}}</p>
            }
        </div>
    </div>
