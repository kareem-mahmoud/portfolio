<ng-container>
@if(currentUrl() === '/home') {
<section class="skills_section container mt-5">
    <div class="row">
        <div class="col-md-12 text-color_white">
            <section class="title_container ">
                <div class="row">
                    <div class="col-md-12 position-relative">
                        <h2 class="position-relative m-0 title">
                            <span class="d-inline-block mark_color">#</span>
                            <span class="d-inline-block text-color_white">Skills</span>
                        </h2>
                        <span class="d-inline-block position-absolute text-color_white view_all">
                            <app-re-button 
                                [buttonHref]="skillsContent().skillsUrl"
                                [buttonText]="skillsContent().skillsButtonText"
                                [buttonIcon]="'~~>'"
                                [buttonAriaLabel]="'all skills'"
                                [buttonClass]="'text_btn'"
                            ></app-re-button>
                        </span>
                    </div>
                </div>
            </section>
            <section class="skills_container">
                <div class="row">
                    <div class="col-xl-4 col-lg-4 col-md-6 col-sm-12">
                        <div class="item mb-5 h-100">
                            <div class="img_box">
                                <!-- <img src="{{skillsImg()}}" alt="skills"> -->
                            </div>
                        </div>
                    </div>
                    <div class="col-xl-8 col-lg-8 col-md-6 col-sm-12">
                        <div class="skills_box">
                            <div class="container">
                                <div class="row">
                                    <div class="col-md-4 text-color_white">
                                        <div class="item mb-5 h-100">
                                            <div class="item_title p-3">
                                                <p class="m-0 p-0 text-color_white">Kareem</p>
                                            </div>
                                            <div class="item_content p-3">
                                                kareem kareem kareem
                                            </div>
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div> 
    </div>
</section>
}
</ng-container>
