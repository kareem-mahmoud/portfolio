<footer class="footer container-fluid">
    <div class="footer-container container bg-color">
        <div class="row pt-5">
            <div class="col-md-4">
                <div class="info_box">
                    <img [src]="profile[4].logo" alt="logo" class="logo mb-3">
                    <p class="mb-0 text-color_white">
                        {{profile[3].info}}
                    </p>
                </div>
                <div class="icons">
                    <!-- <a [href]="profile[5][0].url" target="_blank">
                        <img [src]="profile[5][0].icon" alt="{{profile[5][0].name}}">
                        <span>{{profile[5][0].name}}</span>
                    </a>
                    <a [href]="profile[5][1].url" target="_blank">
                        <img [src]="profile[5][1].icon" alt="{{profile[5][1].name}}">
                        <span>{{profile[5][1].name}}</span>
                    </a> -->
                    
                </div>
            </div>
            <div class="col-md-4">
                <ul class="navbar-nav nav_box">
                    <li class="displayNone">kareem</li>

                    @for(link of footerLinks(); track link.link) {
                        <li class="nav-item">
                            <a class="nav-link text-color_white" [routerLink]="link.link">
                                <span class="d-inline-block mark_color">#</span>
                                <span class="d-inline-block">{{link.name}}</span>
                            </a>
                        </li>
                    }

                </ul>
            </div>
            <div class="col-md-4">
                <div class="contact_box">
                    <p class="text-color_white mb-3 mt-5">{{profile[6].hireMe}}</p>

                    <app-re-button 
                        [buttonHref]="'mailto:kareem.mahmoud.abd.elhannan@gmail.com?subject=Service%20Inquiry&body=Hello%20Kareem,'"
                        [buttonText]="'Inquire a Service'"
                        [buttonIcon]="'~>'"
                        [buttonAriaLabel]="'Inquire a Service'"
                        [buttonTarget]="'_blank'"
                        rel="noopener noreferrer"
                    ></app-re-button>
                </div>
            </div>
            <div class="col-md-12 mt-5 mb-5">
                <p class="text-color_gray">© Copyright {{currentYear()}}. Developed by {{profile[0].title}}</p>
            </div>
        </div> 
    </div>

</footer>
