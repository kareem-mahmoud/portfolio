<header class="header-container container-fluid py-2 position-relative" [class.scrolled]="isScrolled()">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <nav class="navbar navbar-expand-md">
                    <a class="navbar-brand text-color_white" href="/" aria-label="Home">
                        <img [src]="logo()" alt="logo" class="logo">
                    </a>
                    <button class="navbar-toggler text-color_white" type="button" (click)="toggleMenu()"
                        aria-controls="navbarNav" [attr.aria-expanded]="isMenuOpen()" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="navbar-collapse" id="navbarNav" [class.collapse]="!isMenuOpen()" [class.show]="isMenuOpen()">
                        <ul class="navbar-nav ms-auto">
                            <li class="displayNone">kareem</li>
                            @for(link of headerLinks(); track $index) {
                                <li class="nav-item">
                                    <a class="nav-link text-color_white" (click)="closeMenu()">
                                        <span class="d-inline-block mark_color">#</span>
                                        <span class="d-inline-block">{{link.name}}</span>
                                    </a>
                                </li>
                            }
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>
