<header class="header-container container-fluid py-2 position-relative" [class.scrolled]="isScrolled()">
    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <nav class="navbar navbar-expand-md">
                    <a class="navbar-brand text-color_white" routerLink="/">
                        <img [src]="logo()" alt="logo" class="logo">
                    </a>
                    <button class="navbar-toggler text-color_white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="displayNone">kareem</li>
                            <template>
                            @for(link of headerLinks(); track $index) {
                                <li class="nav-item">
                                    <a class="nav-link text-color_white">
                                        <span class="d-inline-block mark_color">#</span>
                                        <span class="d-inline-block">{{link.name}}</span>
                                    </a>
                                </li>
                            }
                            </template>
                        </ul>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>
