<section class="projects_section container mt-5">
    <div class="row">
        <div class="col-lg-12 col-md-12 text-color_white">
            <section class="projects_container">
                <div class="row mb-4">
                    <div class="col-lg-12 col-md-12">
                        <app-re-button
                            [buttonHref]="herfPreventDefault"
                            [buttonText]="'Back'"
                            [buttonIcon]="'<~'"
                            (buttonClick)="goBack()"     
                            (keydown.enter)="goBack()"                           
                        >
                        </app-re-button>
                    </div>
                </div>
                <div class="row">
                    
                        @for(project of allProjects(); track $index) {
                            <!-- @if(project.name.includes('Ltd')) { -->
                                <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12 mb-4">
                                    <app-project-card 
                                        [projectId]="project.id"
                                        [projectImageUrl]="project.imgUrl"
                                        [projectImageAlt]="project.name"
                                        [projectSkills]="project.skills"
                                        [projectName]="project.name"
                                        [projectDescription]="project.description"
                                        [projectLiveFlag]="project.liveFlag"
                                        [projectLiveUrl]="project.liveUrl"
                                        [projectCategory]="project.category"
                                        [projectStack]="project.stack"
                                    ></app-project-card>
                                </div>
                            <!-- } -->
                        }

                </div>
            </section>
        </div> 
    </div>
</section>
