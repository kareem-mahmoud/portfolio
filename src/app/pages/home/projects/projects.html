<section class="projects_section container mt-5">
    <div class="row">
        <div class="col-md-12 text-color_white">
            <section class="title_container ">
                <div class="row">
                    <div class="col-md-12 position-relative">
                        <h2 class="position-relative m-0 title">
                            <span class="d-inline-block mark_color">#</span>
                            <span class="d-inline-block text-color_white">Projects</span>
                        </h2>
                        <span class="d-inline-block position-absolute text-color_white view_all">
                            <a routerLink="/all-projects">View all ~~></a>
                        </span>
                    </div>
                </div>
            </section>
            <section class="projects_container">
                <div class="row">
                    
                        @for(project of projectsList(); track $index) {
                            <div class="col-xl-3 col-lg-4 col-md-6 col-sm-12">
                                <app-project-card 
                                    [projectId]="project.id"
                                    [projectImageUrl]="project.imgUrl"
                                    [projectImageAlt]="project.name"
                                    [projectSkills]="project.skills"
                                    [projectName]="project.name"
                                    [projectDescription]="project.description"
                                    [projectLiveFlag]="project.liveFlag"
                                    [projectLiveUrl]="project.liveUrl"
                                    [projectCategory]="project.category"
                                    [projectStack]="project.stack"
                                ></app-project-card>
                            </div>
                        }

                </div>
            </section>
        </div> 
    </div>
</section>
