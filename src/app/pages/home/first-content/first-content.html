<section class="first-content_container container-fluid">
    <div class="container content-container">
        <div class="row">
            <div class="col-md-12">
                <div class="content-wrapper">
                    <section class="inner-content_container">
                        <div class="row">
                            <div class="col-lg-6 col-md-12 col-sm-12">
                                <div class="box h-100 mt-5">
                                    <h1 class="text-color_gray mb-3">
                                        <span class="text-color_white">
                                             {{firstContent().firstContentH1A}}
                                        </span>
                                        <span class="mark_color">
                                            {{firstContent().firstContentH1B}}
                                        </span>
                                    </h1>
                                    <p class="text-color_gray mb-5">
                                        {{firstContent().firstContentP}}
                                    </p>
                                    <app-re-button 
                                        [buttonHref]="firstContent().firstContentButtonURL"
                                        [buttonText]="firstContent().firstContentButtonText"
                                        [buttonIcon]="'~>'"
                                        [buttonAriaLabel]="'Contact-us'"
                                        [buttonTarget]="'_blank'"
                                    ></app-re-button>
                                </div>
                            </div>

                            <div class="col-lg-6 col-md-12 col-sm-12">
                                <div class="item mb-5 h-100">
                                    <div class="img_box d-flex flex-column justify-content-start align-items-center h-100">
                                        <svg width="1" height="1" viewBox="0 0 1 1" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <path
                                            d="M1 0.5H0C0 0.367392 0.0526784 0.240215 0.146447 0.146447C0.240215 0.0526784 0.367392 0 0.5 0C0.632608 0 0.759785 0.0526784 0.853553 0.146447C0.947322 0.240215 1 0.367392 1 0.5ZM1 1H0C0 0.867392 0.0526784 0.740215 0.146447 0.646447C0.240215 0.552678 0.367392 0.5 0.5 0.5C0.632608 0.5 0.759785 0.552678 0.853553 0.646447C0.947322 0.740215 1 0.867392 1 1Z"
                                            fill="black"
                                        />
                                        </svg>
                                        <!-- <div class="color_box py-2 px-3 border d-flex justify-content-center align-items-center">
                                            <span class="d-flex"></span>
                                            <span class="d-flex text-color_gray">
                                                {{firstContent().firstContentImgSlug}}
                                            </span>
                                        </div> -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</section>
