
name: Deploy Angular Portfolio

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npm run build -- --configuration production --base-href /portfolio/

      - name: Prepare GitHub Pages
        run: |
          cp dist/portfolio/browser/index.html dist/portfolio/browser/404.html
          find dist/portfolio/browser -type f \( -name '*.php' -o -name '.htaccess' \) -delete

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/portfolio/browser

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

